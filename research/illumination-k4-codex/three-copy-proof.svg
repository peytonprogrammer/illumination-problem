<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 650"><rect width="1020" height="650" fill="white"/><text x="40" y="51" font-family="Arial" font-size="26" fill="#243c50">A geometric explanation of the 22-wall room</text><text x="65" y="132" font-family="Arial" font-size="22" fill="#243c50">One staircase: 10 walls</text><text x="520" y="92" font-family="Arial" font-size="22" fill="#243c50">Three reflected copies: 22 walls</text><rect x="90" y="265" width="70" height="70" fill="#dcebf6"/><rect x="160" y="335" width="70" height="70" fill="#dcebf6"/><rect x="160" y="265" width="70" height="70" fill="#dcebf6"/><rect x="230" y="405" width="70" height="70" fill="#dcebf6"/><rect x="230" y="335" width="70" height="70" fill="#dcebf6"/><polyline points="90,335 160,335" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="90,265 160,265" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="90,335 90,265" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="160,405 230,405" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="160,405 160,335" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="230,335 230,265" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="160,265 230,265" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="230,475 300,475" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="300,475 300,405" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="230,475 230,405" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="300,405 300,335" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="230,335 300,335" fill="none" stroke="#243c50" stroke-width="3"/><circle cx="160" cy="265" r="6" fill="#a84e12"/><text x="154" y="249" font-family="Arial" font-size="18" fill="#a84e12">a</text><circle cx="300" cy="405" r="6" fill="#a84e12"/><text x="312" y="413" font-family="Arial" font-size="18" fill="#a84e12">b</text><rect x="505" y="305" width="65" height="65" fill="#dcebf6"/><rect x="570" y="370" width="65" height="65" fill="#dcebf6"/><rect x="570" y="305" width="65" height="65" fill="#dcebf6"/><rect x="635" y="435" width="65" height="65" fill="#dcebf6"/><rect x="635" y="370" width="65" height="65" fill="#dcebf6"/><rect x="505" y="240" width="65" height="65" fill="#e2f0de"/><rect x="570" y="240" width="65" height="65" fill="#e2f0de"/><rect x="570" y="175" width="65" height="65" fill="#e2f0de"/><rect x="635" y="175" width="65" height="65" fill="#e2f0de"/><rect x="635" y="110" width="65" height="65" fill="#e2f0de"/><rect x="700" y="175" width="65" height="65" fill="#f9e5ce"/><rect x="700" y="110" width="65" height="65" fill="#f9e5ce"/><rect x="765" y="240" width="65" height="65" fill="#f9e5ce"/><rect x="765" y="175" width="65" height="65" fill="#f9e5ce"/><rect x="830" y="240" width="65" height="65" fill="#f9e5ce"/><polyline points="505,370 570,370" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="505,370 505,305" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="570,435 635,435" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="570,435 570,370" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,370 635,305" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,500 700,500" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="700,500 700,435" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,500 635,435" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="700,435 700,370" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,370 700,370" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="505,240 570,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="505,305 505,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,305 635,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="570,175 635,175" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="570,240 570,175" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,240 700,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,110 700,110" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="635,175 635,110" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="700,240 765,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="765,175 765,110" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="700,110 765,110" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="765,305 830,305" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="765,305 765,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="830,240 830,175" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="765,175 830,175" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="830,305 895,305" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="895,305 895,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="830,240 895,240" fill="none" stroke="#243c50" stroke-width="3"/><polyline points="505,305 516,305" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="527,305 538,305" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="548,305 559,305" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="570,305 581,305" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="592,305 602,305" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="613,305 624,305" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="700,240 700,229" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="700,218 700,208" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="700,197 700,186" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="700,175 700,164" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="700,153 700,142" fill="none" stroke="#a84e12" stroke-width="3"/><polyline points="700,132 700,121" fill="none" stroke="#a84e12" stroke-width="3"/><circle cx="570" cy="305" r="6" fill="#a84e12"/><text x="582" y="313" font-family="Arial" font-size="18" fill="#a84e12">S</text><circle cx="700" cy="175" r="6" fill="#a84e12"/><text x="712" y="183" font-family="Arial" font-size="18" fill="#a84e12">T</text><text x="80" y="197" font-family="Arial" font-size="17" fill="#243c50">Both boundary marks are even-even.</text><text x="80" y="222" font-family="Arial" font-size="17" fill="#243c50">Every other integer point is a corner.</text><text x="575" y="542" font-family="Arial" font-size="17" fill="#243c50">Dashed walls are glued seams.</text><text x="50" y="596" font-family="Arial" font-size="21" fill="#243c50">Fold the colored copies onto the staircase. S maps to a; T maps to b.</text><text x="50" y="627" font-family="Arial" font-size="17" fill="#243c50">The four smooth seam endpoints fold to right-angle corners that send a path back along itself.</text></svg>