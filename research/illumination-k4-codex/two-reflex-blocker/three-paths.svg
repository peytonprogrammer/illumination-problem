<polygon points="1015.0,460.0 1375.0,460.0 1375.0,190.0 1285.0,190.0 1285.0,370.0 1105.0,370.0 1105.0,190.0 1015.0,190.0" fill="#f4f5f7" stroke="#293442" stroke-width="3"/>
