<polyline points="580.0,280.0 535.0,316.0 715.0,460.0 895.0,316.0 850.0,280.0" fill="none" stroke="#2863a5" stroke-width="3"/>
<circle cx="580.0" cy="280.0" r="5" fill="#17212d"/><text x="575.0" y="268.0" font-family="Arial" font-size="20">s</text>
<circle cx="850.0" cy="280.0" r="5" fill="#17212d"/><text x="845.0" y="268.0" font-family="Arial" font-size="20">t</text>
<circle cx="715.0" cy="460.0" r="8" fill="white" stroke="#9a3150" stroke-width="3"/>
